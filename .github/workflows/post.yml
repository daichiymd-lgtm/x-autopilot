name: X Autopilot Post

# 2026-08-24: xAI $10課金で定期実行を停止。
# 2026-11: 検索を Claude API の web_search に切り替え（xAI は呼ばない）。予定は1日3回。
# スイッチは config.yaml の publish.frozen ひとつ。true のあいだは起動しても API を呼ばずに終わる。
# X API のクレジットを補充してから false にする（2026-06-25 以降は 402 credits depleted で全て失敗）。
on:
  schedule:
    - cron: "17 23 * * *"   # 08:17 JST morning1（速報）
    - cron: "17 3 * * *"    # 12:17 JST morning2（実用ネタ）
    - cron: "17 9 * * *"    # 18:17 JST evening2（保存版）
  workflow_dispatch:
    inputs:
      slot:
        description: '手動実行するスロット'
        default: 'morning1'
        type: choice
        options: [morning1, morning2, afternoon1, evening1, evening2]
      dry_run:
        description: 'ドライラン（投稿しない）'
        default: false
        type: boolean

permissions:
  contents: write   # 台帳(ledger)をリポジトリに書き戻すため

concurrency:
  group: x-autopilot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Resolve slot from schedule
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "17 23 * * *") echo "slot=morning1" >> "$GITHUB_OUTPUT" ;;
            "17 3 * * *")  echo "slot=morning2" >> "$GITHUB_OUTPUT" ;;
            "17 9 * * *")  echo "slot=evening2" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run slot
        env:
          X_AUTOPILOT_FROZEN: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_CHANNEL: ${{ secrets.SLACK_DM_CHANNEL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m xautopilot.run --slot "${{ steps.slot.outputs.slot }}" --dry-run
          else
            python -m xautopilot.run --slot "${{ steps.slot.outputs.slot }}"
          fi

      - name: Persist ledger
        if: always()
        run: |
          git config user.name "x-autopilot-bot"
          git config user.email "x-autopilot-bot@users.noreply.github.com"
          git add data/_post_ledger.json data/guidance.json 2>/dev/null || true
          git commit -m "chore: update ledger [skip ci]" || echo "no changes"
          git push || echo "push skipped"
